name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create the GitHub Release and upload artifacts
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify artifacts
        run: |
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.whl dist/*.tar.gz \
              --title "$tag" \
              --notes "CatBa $tag"
          fi

      # PyPI Trusted Publishing (OIDC) is registered for the `catba` project
      # under the `pypi` GitHub environment.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
