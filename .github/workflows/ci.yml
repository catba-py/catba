name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -v

      - name: Verify package build
        run: |
          python -m pip install build
          python -m build
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install native build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make

      - name: Build and run native tests
        run: |
          cd native
          chmod +x build.sh
          ./build.sh tests

      - name: Build native server
        run: |
          cd native
          ./build.sh server

      - name: Run sanitizer tests (ASan + UBSan + LSan)
        run: |
          cd native
          SAN=asan ./build.sh tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run SSR integration tests
        env:
          CI: "true"
        run: python -m unittest tests.test_ssr_e2e -v
